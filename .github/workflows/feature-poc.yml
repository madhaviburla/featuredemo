name: Feature POC
on: 
 push: 
  branches: 
    - develop
jobs:
  feast-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feast pandas scikit-learn pyarrow
          pip install feast[snowflake]
      - name: Validate feast
        run: feast version
      - name: Execute Module 0
        run: |
          cd module_0
          ls
      - name: Execute Module 1
        run: |
          cd module_1
          ls
      - name: Execute Module 2
        run: |
          cd module_2
          ls
      - name: Execute Compute Engine
        run: |
          cd module_5_compute_engine/feature_repo
          feast apply --verbose
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: feast result
          path: .
          
        
          
        
        
          
          
          
        
    
    
